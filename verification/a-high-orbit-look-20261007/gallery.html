<!doctype html><html lang="ko"><meta charset="utf-8"><title>지구 광학 비교</title><style>body{background:#10151c;color:#eee;margin:32px;font:16px/1.7 system-ui}img{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}</style><h1>고시점 지구 재질·광학 후보</h1><p>왼쪽 대기 off / 오른쪽 대기 on. Moto 공개 4K 지도 재질의 Blender 번역이며 원작 shader·카메라 재현이 아닙니다. 극지는 실측 DEM이 아닌 제한된 조형 근사, 대기는 단색 방사형 산란 근사입니다. 높은 시점 외관 시험이며 실제 궤도 모델·지역지형 인계·완성 구름 장면은 아닙니다.</p><h2>earth-hero</h2><div class="grid"><figure><img src="earth-hero-volume-off.png"><figcaption>volume-off</figcaption></figure><figure><img src="earth-hero-volume-on.png"><figcaption>volume-on</figcaption></figure></div><h2>high-orbit</h2><div class="grid"><figure><img src="high-orbit-volume-off.png"><figcaption>volume-off</figcaption></figure><figure><img src="high-orbit-volume-on.png"><figcaption>volume-on</figcaption></figure></div><p>TUNE: 대기광 목표 강도/낮밤 경계, 해양 반사 hotspot, 극지 윤곽 재질. 구름 및 지역 DEM은 별도 제작분과 통합해야 합니다.</p>
