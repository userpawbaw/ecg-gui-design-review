<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A · 구름 흰 윗면 비교</title><style>body{margin:0;background:#111a24;color:#e6edf4;font-family:system-ui;line-height:1.65}main{padding:30px;max-width:1600px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}figure{margin:0;background:#1b2a39;padding:8px}img{width:100%;display:block}a{color:#9cd4ff}figcaption{padding:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style><main><h1>구름 흰 윗면 · 직접광만 독립 증량</h1><p>밝은 면은 흰색으로, 그늘은 기존 밝기로 유지한 실제 렌더 후보입니다. 지도 노출·광원 방향·구름 분포·높이·불투명도는 같은 조건입니다. <b>추천: 가운데 후보 / 최종 채택 전 TUNE</b>.</p><p>왼쪽보다 밝은 윗면과 어두운 골이 분리됩니다. 오른쪽은 더 밝지만 일부 구름의 표면 결이 약해집니다. 구름은 height-field 근사이며 완전한 volume scattering 구현은 아닙니다.</p><p><a href="http://127.0.0.1:4198/cloud-lab.html?cloudDetail=1&amp;orbital=1&amp;handoff=1&amp;terrainSeam=1&amp;pose=north300&amp;recipe=curtain&amp;reviewRound=cloud-white-20261010">실제 스크롤 검토 화면</a></p><h2>북유럽 확대 · p 0.1584</h2><div class="grid"><figure><a href="../a-cloud-sculpt-20261006/native-captures/cloud-white-20261010/white-contrast-p1584.png"><img src="../a-cloud-sculpt-20261006/native-captures/cloud-white-20261010/white-contrast-p1584.png"></a><figcaption>이전 · 회색 윗면</figcaption></figure><figure><a href="../a-cloud-sculpt-20261006/native-captures/cloud-white-20261010/white-white-p1584.png"><img src="../a-cloud-sculpt-20261006/native-captures/cloud-white-20261010/white-white-p1584.png"></a><figcaption>추천 후보 · 흰 윗면</figcaption></figure><figure><a href="../a-cloud-sculpt-20261006/native-captures/cloud-white-20261010/white-white-strong-p1584.png"><img src="../a-cloud-sculpt-20261006/native-captures/cloud-white-20261010/white-white-strong-p1584.png"></a><figcaption>더 밝은 후보 · 세부 손실 주의</figcaption></figure></div><h2>근접 구름 윗면 · p 0.235</h2><div class="grid"><figure><a href="../a-cloud-sculpt-20261006/native-captures/cloud-white-20261010/white-contrast-p2350.png"><img
