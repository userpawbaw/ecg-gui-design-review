<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECG · A 서고</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#070707;color:#e5e0d8;font-family:Arial,'Malgun Gothic',sans-serif}#wrap{height:100vh;overflow:auto}#content{height:430vh}#stage{position:fixed;inset:0;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}#wavebox{position:absolute;inset:0;pointer-events:none;opacity:0}#labels{position:absolute;left:48%;top:30%;opacity:0;pointer-events:none}#labels small{font:11px monospace;letter-spacing:3px;color:#a6a39f}#labels h2{font-size:clamp(24px,3vw,48px);font-weight:500;letter-spacing:-2px;margin:10px 0}#title{position:absolute;left:7%;top:10%;margin:0;font-size:clamp(24px,3.6vw,58px);font-weight:500;letter-spacing:-2px;line-height:1.1;pointer-events:none}#title small{display:block;font:11px monospace;letter-spacing:3px;margin-bottom:18px;color:#a69c88}#hint{position:absolute;left:7%;bottom:6%;font:11px monospace;color:#9e9485;letter-spacing:2px;pointer-events:none}#status{position:absolute;right:4%;bottom:5%;font:11px monospace;color:#807569}#qa{position:absolute;right:20px;top:20px;display:none;background:#151515e8;padding:16px;z-index:9;font:12px monospace}#qa label{display:block;margin:10px}#qa input[type=range]{width:180px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#070707;color:#978d7e;z-index:10}button{background:#29251f;color:#ddd;border:1px solid #615746;padding:7px} @media(max-width:800px){#title{top:6%}#labels{left:40%;top:38%}#labels h2{font-size:24px}}</style>
