<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서고 · baked-light web review</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; background: #111720; color: #e9e7e0; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    header { position: fixed; z-index: 2; inset: 18px auto auto 20px; padding: 10px 13px; border: 1px solid #ffffff22; border-radius: 7px; background: #111720cc; backdrop-filter: blur(8px); }
    header strong { display: block; font-size: 13px; letter-spacing: .04em; }
    header span { display: block; margin-top: 2px; color: #b9c0c9; font-size: 12px; }
    #status { position: fixed; right: 20px; top: 20px; z-index: 2; color: #cbd6df; }
    button { position: fixed; right: 20px; bottom: 20px; z-index: 2; padding: 9px 12px; border: 1px solid #ffffff44; border-radius: 6px; color: #f5f1e8; background: #111720cc; cursor: pointer; }
    #error { position: fixed; inset: auto 20px 64px; z-index: 3; color: #ff9f9f; white-space: pre-wrap; }
  </style>
  <script type="importmap">
    {"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
  </script>
</head>
<body>
  <header><strong>서고 · 실제 baked-light GLB</strong><span>드래그: 둘러보기 · 휠: 거리 · 우클릭 드래그: 이동</span></header>
  <div id="status">베이크 에셋을 불러오는 중…</div>
  <div id="error"></div>
  <button id="reset" type="button">처음 시점</button>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const status = document.querySelector('#status');
    const fail = (error) => { document.querySelector('#error').textContent = String(error?.stack || error); status.textContent = '로드 실패'; };
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.16;
    renderer.setClearColor(0x111720, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(37, innerWidth / innerHeight, 0.05, 100);
    const initialPosition = new THREE.Vector3(8.5, 5.5, 17.0);
    const initialTarget = new THREE.Vector3(0.0, 2.15, -1.5);
    camera.position.copy(initialPosition);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(initialTarget);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 4;
    controls.maxDistance = 35;
    controls.minPolarAngle = 0.12;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.update();
    controls.saveState();

    const loaded = await fetch('./manifest.json');
    if (!loaded.ok) throw new Error(`manifest HTTP ${loaded.status}`);
    const manifest = await loaded.json();
    const lightmaps = {};
    const texLoader = new THREE.TextureLoader();
    await Promise.all(Object.entries(manifest.groups).map(async ([group, info]) => {
      if (!info.file) return;
      const texture = await texLoader.loadAsync(`./${info.file}`);
      texture.flipY = false;
      texture.colorSpace = THREE.NoColorSpace;
      texture.channel = 1;
      lightmaps[group] = texture;
    }));

    const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    const gltf = await loader.loadAsync('./archive.glb');
    const groupOf = (object) => {
      let current = object;
      while (current) {
        for (const [group, info] of Object.entries(manifest.groups)) {
          if (current.name === info.object || current.name.startsWith(`${info.object}_`)) return group;
        }
        current = current.parent;
      }
      return 'shell';
    };
    const shared = { lmScale: { value: manifest.lm_scale }, uFade: { value: 1 }, uExposure: { value: 1.3 }, uSat: { value: 0.72 } };
    gltf.scene.traverse((object) => {
      if (!object.isMesh) return;
      const group = groupOf(object);
      const source = object.material;
      const vertexColor = !lightmaps[group];
      const map = source.map;
      if (map) map.updateMatrix();
      const material = new THREE.ShaderMaterial({
        uniforms: {
          ...shared,
          map: { value: map }, useMap: { value: !!map }, color: { value: source.color.clone() },
          lm: { value: lightmaps[group] || null }, mapChannel: { value: map?.channel ?? 0 },
          mapTransform: { value: map ? map.matrix : new THREE.Matrix3() },
          alphaTest: { value: source.alphaTest || (source.transparent ? 0.4 : 0) }
        },
        defines: vertexColor ? { VC: '' } : {},
        vertexShader: `attribute vec2 uv1; attribute vec2 uv2;
          uniform int mapChannel; uniform mat3 mapTransform;
          #ifdef VC
          attribute vec4 color; varying vec3 vLight;
          #endif
          varying vec2 vUv, vUv1;
          vec2 pick(int c) { return c == 2 ? uv2 : (c == 1 ? uv1 : uv); }
          void main() { vUv = (mapTransform * vec3(pick(mapChannel), 1.)).xy; vUv1 = uv1;
            #ifdef VC
            vLight = color.rgb;
            #endif
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
        fragmentShader: `uniform sampler2D map, lm; uniform bool useMap; uniform vec3 color;
          uniform float lmScale, uFade, uExposure, uSat, alphaTest; varying vec2 vUv, vUv1;
          #ifdef VC
          varying vec3 vLight;
          #endif
          void main() { vec4 a = useMap ? texture2D(map, vUv) : vec4(1.);
            if (alphaTest > 0. && a.a < alphaTest) discard;
            #ifdef VC
            vec3 e = vLight;
            #else
            vec3 e = texture2D(lm, vUv1).rgb;
            #endif
            vec3 c = a.rgb * color * e * e * lmScale * uExposure * uFade;
            c = mix(vec3(dot(c, vec3(.2126, .7152, .0722))), c, uSat);
            gl_FragColor = vec4(c, 1.);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }`,
        side: source.side,
        transparent: source.transparent,
        toneMapped: true
      });
      object.material = material;
    });
    scene.add(gltf.scene);
    status.textContent = `베이크 조명 적용 · ${Object.keys(lightmaps).length} lightmaps · meshopt GLB`;
    window.__archivePreview = { camera, controls, groups: Object.keys(manifest.groups), lightmaps: Object.keys(lightmaps) };

    document.querySelector('#reset').addEventListener('click', () => {
      const damping = controls.enableDamping;
      controls.enableDamping = false;
      controls._sphericalDelta?.set(0, 0, 0);
      controls._panOffset?.set(0, 0, 0);
      controls._scale = 1;
      camera.position.copy(initialPosition);
      controls.target.copy(initialTarget);
      controls.update();
      controls.saveState();
      controls.enableDamping = damping;
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  </script>
</body>
</html>
