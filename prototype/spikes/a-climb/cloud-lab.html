<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A · Takram 구름 비교</title><style>html,body{margin:0;overflow:hidden;background:#08121c;color:white;font:14px system-ui}canvas{display:block}#panel{position:fixed;z-index:10;top:16px;right:16px;width:240px;background:#111c29dd;border:1px solid #526274;padding:14px;border-radius:8px}label{display:block;margin:10px 0}select,button,input{font:inherit}select,button{width:100%;padding:8px;background:#233449;color:white;border:1px solid #73859a}input[type=range]{width:100%}small{display:block;color:#c1d5e6;line-height:1.5;margin-top:8px}#status{position:fixed;left:20px;bottom:15px;background:#091321b0;padding:10px;max-width:65vw;white-space:pre-wrap;font:12px monospace}#error{position:fixed;z-index:20;left:20px;top:20px;color:#ffaca1;white-space:pre-wrap}</style><body><aside id="panel"><strong>Takram · 독립 비교 후보</strong><label>검토 구도<select id="pose" aria-label="검토 구도"><option value="source500">원형 Vanilla · 500m</option><option value="source3500">원형 Vanilla · 3500m</option><option value="north265">북유럽 · 하강</option><option value="north300">북유럽 · 구름 접근</option><option value="north345">북유럽 · 진입</option></select></label><label>품질<select id="quality" aria-label="구름 품질"><option>high</option><option>medium</option><option>ultra</option><option>low</option></select></label><label><input id="temporal" type="checkbox" checked> 시간 누적</label><label><input id="enabled" type="checkbox" checked> 구름</label><label><input id="wind" type="checkbox"> 바람 이동</label><label>카메라 진행<input id="progress" aria-label="카메라 진행" type="range" min="0.235" max="0.365" step="0.0001" value="0.265"></label><button id="save">프레임 저장</button><small>외부 렌더러를 적용한 실제 후보입니다.<br>지형1.5× 유지 · 아직 최종 채택 전<br>원형 뷰: 드래그/휠 · 북유럽: 진행 슬라이더</small></aside><output id="status" aria-label="렌더 상태">구름·산란 데이터 준비 중</output><pre id="error"></pre><script type="module" src="./cloud-lab.ts"></script></body></html>
